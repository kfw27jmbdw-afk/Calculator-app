<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculator App</title>
<style>
  body {
    background: linear-gradient(135deg, #84fab0, #8fd3f4);
    font-family: "Poppins", sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
  }

  .calculator {
    background: #fff;
    padding: 20px;
    border-radius: 16px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    width: 320px;
  }

  input {
    width: 100%;
    height: 60px;
    font-size: 1.6rem;
    text-align: right;
    border: none;
    outline: none;
    margin-bottom: 12px;
    padding: 10px;
    border-radius: 8px;
    background: #f0f0f0;
  }

  .buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }

  button {
    height: 60px;
    font-size: 1.2rem;
    border: none;
    border-radius: 8px;
    background: #e0e0e0;
    cursor: pointer;
    transition: all 0.2s;
  }

  button:hover {
    background: #d1d1d1;
  }

  .equal {
    background: #6c63ff;
    color: white;
  }

  .equal:hover {
    background: #5a53e0;
  }

  .clear {
    background: #ff5c8a;
    color: white;
  }

  .clear:hover {
    background: #e64b74;
  }

  .undo {
    background: #ffa931;
    color: white;
  }

  .undo:hover {
    background: #f18c00;
  }
</style>
</head>
<body>

<div class="calculator">
  <input type="text" id="display" readonly>
  <div class="buttons">
    <button onclick="clearDisplay()" class="clear">C</button>
    <button onclick="appendValue('/')">÷</button>
    <button onclick="appendValue('*')">×</button>
    <button onclick="deleteLast()">⌫</button>

    <button onclick="appendValue('7')">7</button>
    <button onclick="appendValue('8')">8</button>
    <button onclick="appendValue('9')">9</button>
    <button onclick="appendValue('-')">−</button>

    <button onclick="appendValue('4')">4</button>
    <button onclick="appendValue('5')">5</button>
    <button onclick="appendValue('6')">6</button>
    <button onclick="appendValue('+')">+</button>

    <button onclick="appendValue('1')">1</button>
    <button onclick="appendValue('2')">2</button>
    <button onclick="appendValue('3')">3</button>
    <button onclick="calculate()" class="equal">=</button>

    <button onclick="appendValue('0')">0</button>
    <button onclick="appendValue('.')">.</button>
    <!-- 👇 New Undo Button -->
    <button onclick="undoLast()" class="undo">↩️ Undo</button>
  </div>
</div>

<script>
  const display = document.getElementById('display');
  let history = []; // 👈 store previous results here

  function appendValue(value) {
    display.value += value;
  }

  function clearDisplay() {
    display.value = '';
  }

  function deleteLast() {
    display.value = display.value.slice(0, -1);
  }

  function calculate() {
    try {
      // Save current value before calculating (for undo)
      history.push(display.value);
      display.value = eval(display.value);
    } catch {
      display.value = 'Error';
    }
  }

  // 👇 Undo the last calculation
  function undoLast() {
    if (history.length > 0) {
      display.value = history.pop(); // restore last expression
    } else {
      display.value = ''; // if nothing left to undo
    }
  }
</script>

</body>
</html>
