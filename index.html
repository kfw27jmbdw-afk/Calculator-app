<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yarn Count Calculator</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    background:linear-gradient(135deg,#0f172a,#1e293b,#334155);
    overflow:hidden;
}

/* Decorative Background */
body::before,
body::after{
    content:"";
    position:absolute;
    border-radius:50%;
    filter:blur(80px);
    z-index:0;
}

body::before{
    width:300px;
    height:300px;
    background:#38bdf8;
    top:-100px;
    left:-100px;
    opacity:.3;
}

body::after{
    width:300px;
    height:300px;
    background:#f59e0b;
    bottom:-100px;
    right:-100px;
    opacity:.3;
}

.container{
    position:relative;
    z-index:1;
    width:100%;
    max-width:420px;
}

.result-card{
    background:rgba(255,255,255,0.1);
    backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,0.15);
    border-radius:28px;
    padding:30px 20px;
    text-align:center;
    box-shadow:0 20px 40px rgba(0,0,0,0.25);
    margin-bottom:20px;
}

.result-label{
    color:#cbd5e1;
    letter-spacing:3px;
    font-size:14px;
    margin-bottom:10px;
}

.result-value{
    font-size:52px;
    font-weight:700;
    color:#fbbf24;
    transition:.3s;
}

.result-unit{
    color:#e2e8f0;
    margin-top:5px;
    font-size:15px;
}

.form-card{
    background:white;
    border-radius:28px;
    padding:25px;
    box-shadow:0 20px 40px rgba(0,0,0,0.2);
}

.title{
    text-align:center;
    font-size:24px;
    font-weight:700;
    color:#0f172a;
    margin-bottom:20px;
}

.input-group{
    margin-bottom:16px;
}

label{
    display:block;
    margin-bottom:8px;
    color:#334155;
    font-weight:600;
    font-size:14px;
}

input{
    width:100%;
    padding:14px 16px;
    border:2px solid #e2e8f0;
    border-radius:14px;
    font-size:16px;
    outline:none;
    transition:.3s;
}

input:focus{
    border-color:#3b82f6;
    box-shadow:0 0 0 4px rgba(59,130,246,.15);
}

.footer{
    text-align:center;
    margin-top:18px;
    color:#64748b;
    font-size:13px;
}

.yarn-icon{
    font-size:32px;
    margin-bottom:10px;
}

@media(max-width:480px){
    .result-value{
        font-size:42px;
    }
}
</style>
</head>
<body>

<div class="container">

    <div class="result-card">
        <div class="yarn-icon">🧵</div>
        <div class="result-label">LIVE YARN COUNT</div>
        <div class="result-value" id="result">0.00</div>
        <div class="result-unit">Count</div>
    </div>

    <div class="form-card">
        <div class="title">Yarn Count Calculator</div>

        <div class="input-group">
            <label>🧵 Number of Yarns</label>
            <input
                type="number"
                id="yarns"
                placeholder="Enter number of yarns"
                oninput="calculateCount()">
        </div>

        <div class="input-group">
            <label>📏 Length of 1 Yarn (cm)</label>
            <input
                type="number"
                id="length"
                placeholder="Enter length in cm"
                oninput="calculateCount()">
        </div>

        <div class="input-group">
            <label>⚖️ Weight of All Yarns (g)</label>
            <input
                type="number"
                id="weight"
                placeholder="Enter weight in grams"
                oninput="calculateCount()">
        </div>

        <div class="footer">
            Formula: (0.0059 × Yarns × Length) ÷ Weight
        </div>
    </div>

</div>

<script>
function calculateCount() {

    const yarns = parseFloat(document.getElementById("yarns").value);
    const length = parseFloat(document.getElementById("length").value);
    const weight = parseFloat(document.getElementById("weight").value);

    if (
        isNaN(yarns) ||
        isNaN(length) ||
        isNaN(weight) ||
        weight <= 0
    ) {
        document.getElementById("result").textContent = "0.00";
        return;
    }

    const count =
        (0.0059 * yarns * length) / weight;

    document.getElementById("result").textContent =
        count.toFixed(2);
}
</script>

</body>
</html>
